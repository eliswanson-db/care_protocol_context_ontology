    license_or_terms_reference: CC BY 4.0 (terms:license in mondo.obo)
    access_method: anonymous HTTPS (GitHub release)
    local_storage_location: src/standards/life_sciences/mondo_subset.csv
    transformation_version: "1"

  - artifact_id: medrt
    publisher: U.S. Department of Veterans Affairs (distributed by NCI EVS)
    artifact_type: drug_knowledge (MoA, PE, may_treat, CI_with)
    source_location: https://evs.nci.nih.gov/ftp1/MED-RT/Core_MEDRT_XML.zip
    release_version: "2026.11.02"
    retrieved_at: "2026-11-12"
    checksum: sha256:b02c7f44e812e79ed1a87b3e9eb1ab14bb934d987d4fac29751bb5e542c057b6
    license_or_terms_reference: >-
      Public VA release via NCI EVS — the only part used (decision 2026-11-13, ADR-0022). MED-RT docs note "some
      proprietary data requires licensing"; that is UMLS-distributed content, which is not used. Vendored subset keeps
      RxNorm/MeSH/MED-RT endpoints only (no SNOMED CT targets) and the Authority qualifier per edge.
    access_method: anonymous HTTPS
    local_storage_location: src/standards/life_sciences/medrt_subset.csv
    transformation_version: "1"

  - artifact_id: mesh
    publisher: U.S. National Library of Medicine
    artifact_type: vocabulary (bridge: MED-RT concept UI -> descriptor UI -> MONDO xref)
    source_location: https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/desc2026.gz
    release_version: "2026"
    retrieved_at: "2026-11-12"
    checksum: sha256:ccd4d0d33bebfd4c836a59e7dd0c635b1d4e20c4f5a6abc55e2eb0ba4c8716dd
    license_or_terms_reference: https://www.nlm.nih.gov/databases/download/terms_and_conditions_mesh.html
    access_method: anonymous HTTPS
    local_storage_location: src/standards/life_sciences/mesh_bridge_subset.csv
    transformation_version: "1"

  - artifact_id: rxnorm
    publisher: U.S. National Library of Medicine
    artifact_type: drug_vocabulary
    source_location: reused from src/terminology/rxnorm_hier.csv (HEDIS lab) + MED-RT RxNorm references
    release_version: "2026.10.05.26AA (as referenced by MED-RT)"
    retrieved_at: "2026-11-12"
    checksum: null
    license_or_terms_reference: see src/terminology/LICENSES.md
    access_method: vendored
    local_storage_location: src/terminology/rxnorm_hier.csv
    transformation_version: "1"

not_used:
  - {artifact: CDISC Library API (SDTM/SDTMIG metadata, RDF), reason: requires CDISC membership + API key — not available}
  - {artifact: MedDRA, reason: licensed; MH coded with MONDO + ICD-10-CM xrefs instead (labeled deviation)}
  - {artifact: SNOMED CT, reason: licensed; MED-RT edges to SNOMED targets are filtered out}
  - {artifact: WHO ATC, reason: licensing restrictions; MED-RT MoA/EPC classes used instead}
