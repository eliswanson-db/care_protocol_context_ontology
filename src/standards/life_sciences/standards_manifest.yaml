# Standards source manifest — Clinical Study Context & Evidence Lab (demo_id: life_sciences_clinical)
# Open standards only (no CDISC Library membership/API key). Pinned releases. ADR-0022.
# Raw downloads are NOT committed; the acquisition script caches them under the standards-cache path and
# verifies the checksums below. Only small curated subsets are vendored (ADR-0007 pattern).
standards_cache: /Volumes/${catalog}/clinical_study_standards/standards_cache   # UC volume; local: ~/.cache/care_lab/standards

artifacts:
  - artifact_id: cdisc_sdtm_ct
    publisher: CDISC (distributed by NCI EVS)
    artifact_type: controlled_terminology
    source_location: https://evs.nci.nih.gov/ftp1/CDISC/SDTM/SDTM%20Terminology.txt
    release_version: "2026-09-25"   # HTTP Last-Modified of the unversioned file; pin to the dated Archive file when vendoring
    retrieved_at: "2026-11-12"
    checksum: sha256:9e8117a90e28e5aade3ac2d52fe1b60adfcccc92a8894891f04ad05c7cf1f88d
    license_or_terms_reference: https://www.cdisc.org/standards/terminology (CDISC CT published publicly via NCI EVS)
    access_method: anonymous HTTPS
    local_storage_location: src/standards/life_sciences/cdisc_ct_subset.csv
    transformation_version: "1"

  - artifact_id: cdisc_cosmos_bc
    publisher: CDISC (COSMoS)
