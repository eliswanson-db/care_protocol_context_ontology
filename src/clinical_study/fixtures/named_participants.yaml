# Named edge-case participants (SYNTHETIC). Hand-authored, raw EDC-shaped records.
# The generator injects these verbatim into the landing files alongside the dbldatagen population, so they flow
# through bronze -> silver -> gold like everyone else. Their EXPECTED outcomes are hand-calculated in
# tests/fixtures/life_sciences/expected_endpoints.yaml. They are never computed by the engine. That file is the oracle.
#
# Study A defaults for these fixtures: first dose 2025-03-03T09:00 (reference date 2025-03-03).
#   Week 24 target date = 2025-03-03 + 168 days = 2025-08-18.
#   R1 window (+/-7):  2025-08-11 .. 2025-08-25.   R2 window (+/-14): 2025-08-04 .. 2025-09-01.
#   Baseline window study days -28..-1 = 2025-02-03 .. 2025-03-02, plus day-1 records timed before 09:00.
# Raw unit strings are EDC values; silver maps them to CDISC CT (kg, LB, g). Anything else stays unmapped.

# Eligibility inputs (age, sex, height, screening date, MH coded to MONDO, CM coded to RxNorm) default so the
# endpoint fixtures are ordinary eligible participants; the eligibility fixtures (eligibility_case) override them.
defaults:
  CSL-A:
    arm: CSL101
    randomized: true
    exposures: [{exstdtc: "2025-03-03T09:00", exdose: 10, exdosu: mg}]
    site: "SITE-104"
    age: 52
    sex: F
    height_cm: 170
    screening_date: "2025-02-10"
    edc_eligible: Y
    mh: [{mhseq: 1, term: "essential hypertension", mondo_id: "MONDO:0001134", mhstdtc: "2019"}]
    cm: [{cmseq: 1, term: "lisinopril 10 mg", rxnorm: "RXNORM:29046", cmstdtc: "2019-06"}]
  CSL-B:
    arm: CSL101
    randomized: true
    site: "SITE-212"
    age: 58
    sex: M
    height_cm: 170
    edc_eligible: Y
    mh: [{mhseq: 1, term: "type 2 diabetes", mondo_id: "MONDO:0005148", mhstdtc: "2016"}]
    cm: [{cmseq: 1, term: "metformin 1000 mg", rxnorm: "RXNORM:6809", cmstdtc: "2016-04"}]

