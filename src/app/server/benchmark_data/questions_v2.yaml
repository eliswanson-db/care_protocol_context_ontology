    q3: "Audited (no_query, no_query, no_query): The retrieved ked/ssd/spd metric view definitions lack patient-level diabetes or kidney-complication diagnosis codes, so no query could run. Agent: “no table/view with diabetes or kidney-complication diagnosis codes at the patient level is provided in the context.”"
    q4: "Audited (no_query, no_query, no_query): The retrieved metric view YAMLs define protocol adherence and lab metrics but contain no A1c target ranges by comorbidity level. Agent: “no table or document containing the care protocol text (v2025.1) or its A1c target recommendations by age/comorbidity is provided in the context.”"
    q5: "Audited (incomplete, incomplete, incomplete): The retrieved views identify KED as using eGFR but lack the MY2026 LOINC code (98979-8) and KED_EGFR value set source."
    q6: "Audited (no_query, no_query, no_query): The retrieved metric views (gsd_compliance_metrics, spd_compliance_metrics, protocol_drift_metrics) lack any drug-order, condition, lab, or contraindication-rule fields, so the agent declined to query. Agent: “no table/view with patient active drug orders, condition active dates, lab results, or drug-condition contraindication rules is named.”"
    q7: "Audited (no_query, no_query, no_query): The retrieved metric-view YAMLs define SPD gap logic generically but lack any patient_id column, so the agent declined to query patient-specific diagnosis, age, or statin dispensing facts. Agent: “no column identifying individual patients (e.g., patient_id) is named in the context for the SPD compliance data.”"
    q8: "Audited (no_query, no_query, no_query): The retrieved eed_compliance_metrics, gsd_compliance_metrics, and spd_compliance_metrics views define metrics only, missing the outside optometry letter entirely. Agent: “The context has no table recording diabetic eye exams performed outside the EHR (e.g., external exam records or patient-reported data).”"
  closure_sql:
    q1: "Verified: the closure context's table cards include gold_adherence_gsd (a graph-mapped source); one query reproduced the eight clinic rates."
    q2: "Verified: 73 in 2 of 3 runs; run 2 returned 72 (a different 'last A1c' tie-break). Genuine run-to-run variance."
    q3: "Verified: patients_under(E11.2 or E10.2) = 1,881 in the context itself."
    q4: "Audited (no_query, no_query, no_query): This approach only resolves diagnosis/drug concepts to ICD-10/RxNorm hierarchies, so it has no protocol_edges or A1c-target data for older adults with moderate comorbidity. Agent: “no protocol_edges rows for an \"older adult, moderate comorbidity\" population or associated A1c target are shown.”"
    q5: "Audited (incomplete, incomplete, incomplete): The SQL found KED as the measure via protocol_edges but the value_set_segment query returned no rows, omitting the LOINC code and definition source."
    q6: "Verified miss: the runs that queried counted 113 metformin patients (gold 48): they didn't take each patient's last eGFR."
    q7: "Verified incomplete: it has the patient's E11.9 and the statin order in its context, but its query didn't return age or the SPD rule."
    q8: "Audited (no_query, no_query, no_query): Only resolves diabetes diagnosis codes to patient lists, lacking any table for outside-EHR eye-exam records like the optometry letter. Agent: “no table in the context captures eye-exam records sourced from outside the EHR.”"
  rag:
    q1: "Audited (no_query, no_query, no_query): The retrieved care-protocol passages define the GSD measure but contain no per-clinic rate data to compute the answer. Agent: “no table or view with patient-level clinic, A1c, or GMI test data is named in the context.”"
    q2: "Audited (no_query, no_query, no_query): The retrieved care-protocol passages lack patient-level A1c and statin data, so no query ran and the count of 73 is missing. Agent: “no table or view with patient-level diabetes eligibility, A1c results, or statin dispensing data is named.”"
    q3: "Audited (no_query, no_query, no_query): The retrieved care-protocol and eye-exam letters lack any patient counts or diagnosis table data, so the agent declined to query. Agent: “no table or column names for diagnoses/conditions are given in the context.”"
    q4: "Verified: the Glycemic Targets passage states 7.0–8.0% for moderate comorbidity."
    q5: "Audited (incomplete, incomplete, incomplete): The retrieved passages state KED uses eGFR and that only LOINC 98979-8 counts, but never name the KED_EGFR value-set definition source."
    q6: "Audited (no_query, no_query, no_query): The retrieved passages contain only protocol prose and unrelated eye exam letters, lacking any orders, drugs, conditions, or lab data needed to compute the count. Agent: “no tables/columns for orders, drugs, conditions, or lab results are named in the context.”"
    q7: "Audited (nothing, nothing, nothing): Retrieved nothing because care-protocol prose lacks this patient's diagnosis, age, and statin dispensation records."
    q8: "Verified: the outside letter (Northside Optometry Group, 2026-09-02) is only in RAG."
  genie_ontology:
    q1: "Verified: one query on gold_adherence_gsd reproduced the eight rates once told the data ends 2026-10-30 (before: a date-boundary error)."
    q2: "Audited (no_query, no_query, no_query): The agent declined to query because no age field is named for gold_adherence_gsd/gold_adherence_spd, leaving the count of 73 unretrieved. Agent: “no column for patient age (e.g., an age field) in gold_adherence_gsd/gold_adherence_spd is named in the context.”"
    q3: "Audited (one_query, one_query, one_query): The SQL joined diabetes kidney-complication codes via the ICD-10 closure table with onset_date ≤2026-10-30, correctly returning 1,881 patients."
    q4: "Audited (no_query, no_query, no_query): The retrieved Pages cover A1c recheck timing and general protocol rules but lack any age/comorbidity-stratified target of 7.0-8.0%. Agent: “no table or document provides age/comorbidity-stratified A1c targets for 'older adult with moderate comorbidity'.”"
    q5: "Audited (one_query, one_query, one_query): The SQL correctly identifies KED and code 98979-8 for MY2026 but doesn't explicitly confirm eGFR's definition as the versioned KED_EGFR value set."
    q6: "Verified miss: counted 65 metformin patients (gold 48): no last-eGFR logic."
    q7: "Verified: its query uses a `status` column gold no longer has, from snippets mined from the deprecated dev dashboard (Genie's index hasn't refreshed)."
    q8: "Audited (no_query, no_query, no_query): The retrieved EED/HEDIS Pages define the metric generically but lack any field for outside-EHR eye exam records, so no query ran. Agent: “no table or field describing external/outside-EHR eye exam records is named in the context.”"
  ontobricks:
    q1: "Verified: answered in 1 of 3 runs (patients now carry attributedTo Clinic); run 1 got 7 of 8 clinics (CLINIC-05 32.89% vs 32.6%); run 0 returned no rows. SQL over the triple table needs several self-joins in one try."
    q2: "Verified: answered in 1 of 3 runs; the other runs declined."
    q3: "Verified: 1,881 in 2 of 3 runs over hasConditionRecord / recordsCondition / subClassOf with the onset date (now in the graph)."
    q4: "Audited (no_query, no_query, no_query): The subgraph only linked LoincPart/Measure triples, lacking any age/comorbidity-to-A1c-target relation needed for the 7.0-8.0% answer. Agent: “no data links age/comorbidity stratification or protocol version to an A1c target threshold.”"
    q5: "Verified incomplete: KED and 98979-8 (containsTest, MY2026) are found; the value-set location isn't named in 2 of 3 runs."
    q6: "Audited (wrong, query_failed, not_found): The SQL counted 46 patients for metformin/eGFR<30 instead of the gold 48, undercounting matches."
    q7: "Audited (wrong, wrong, wrong): The SQL found an active open-ended statin order from 2009, wrongly implying coverage rather than a true gap."
    q8: "Audited (no_query, no_query, no_query): The retrieved subgraph has only diagnosis/medication/care-gap triples, lacking any outside letter or optometry record of the eye exam. Agent: “no table/column in the context records diabetic eye exams (or any note of exams performed outside the EHR) for patients.”"
  genie_one:
    q1: "Audited (in_context, in_context, in_context): Genie One's own answer directly stated all eight clinics' poor-control rates matching the gold values exactly."
    q2: "Audited (in_context, in_context, in_context): Genie One's own answer explicitly states the figure 73, matching the gold fact exactly."
    q3: "Audited (in_context, in_context, in_context): Genie One's own answer directly stated the correct count of 1,881 patients, matching the gold fact exactly."
    q4: "Verified wrong, structural: the 7.0–8.0% target is in the protocol document (RAG) and an unread Page; Genie One searched the rules table."
    q5: "Audited (in_context, in_context, in_context): Genie One's answer directly states the KED measure, the single MY2026 LOINC 98979-8, and the KED_EGFR value-set source."
    q6: "Audited (in_context, in_context, in_context): Genie One's answer correctly states all gold facts: 67 patients total, with 48 metformin/eGFR<30, 11 ACE-inhibitor/pregnancy, and 9 statin/pregnancy cases."
    q7: "Audited (in_context, in_context, in_context): Genie One's answer directly states all gold facts: E11.9 diabetes diagnosis, age 61, no 2026 statin dispensed, and SPD gap reason."
    q8: "Verified wrong, structural: the letter is only in Lakebase, which Genie One can't reach."

questions:
  - id: q1
    short: "GSD poor control by clinic"
    question: "What was the GSD poor-control rate (last A1c of the year above 9%, or no A1c test) by clinic, for MY2026 through 2026-10-30?"
    answer_type: set of (clinic, rate)
    gold: bq1_gsd_poor_by_clinic
    expected_facts:
      - "GSD poor-control rate by clinic, MY2026 through 2026-10-30: CLINIC-01 37.2%, CLINIC-02 35.3%, CLINIC-03 35.7%, CLINIC-04 37.9%, CLINIC-05 32.6%, CLINIC-06 39.7%, CLINIC-07 36.5%, CLINIC-08 38.3%."
    facts: [F05, F06, F07]
    predictions:
      metric_view: "exact: Poor Control Rate by Clinic is a prebuilt, governed measure"
      closure: "no: closures hold terminology, not measures"
      rag: "no: documents hold no patient data"
      genie_ontology: "context points to the governed view; the rate needs one query"
      graph: "no: patient-to-clinic isn't mapped (F07)"

  - id: q2
    short: "65–75, A1c > 9%, no statin"
    question: "Of GSD-eligible diabetics aged 65-75 in MY2026, how many had a last MY2026 A1c (through 2026-10-30) above 9% and no statin dispensed in MY2026 through 2026-10-30?"
    answer_type: count
    gold: bq2_older_poor_no_statin
    expected_facts:
      - "73 GSD-eligible diabetics aged 65-75 had a last MY2026 A1c above 9% and no statin dispensed in MY2026 (through 2026-10-30)."
    facts: [F05, F06, F08, F09, F26]
    predictions:
      metric_view: "no: it crosses two measures (GSD and SPD); no prebuilt view combines them"
      closure: "partial: the statin class resolves through rxnorm_closure; the A1c values and ages aren't in the closures"
      rag: "no: documents hold no patient data"
      genie_ontology: "context names both gold tables and their rules; the count needs a query"
      graph: "yes once observation values and drug classes are reachable (republish items 1, 3b; F22, F26)"

  - id: q3
    short: "Diabetes with a kidney complication"
    question: "How many patients have diabetes with a kidney complication (a diagnosis on or before 2026-10-30)?"
    answer_type: count
    gold: bq3_kidney_complication
    expected_facts:
      - "1,881 patients have diabetes with a kidney complication (on or before 2026-10-30)."
    facts: [F01, F02]
    predictions:
      metric_view: "no: no measure is built for this cohort"
      closure: "exact: one equality join on icd10_closure"
      rag: "no: documents hold no patient data"
      genie_ontology: "context explains subsumption and the closure table; the count needs a query"
      graph: "yes: subClassOf* walk from the diabetic-kidney roots"

  - id: q4
    short: "A1c target, moderate comorbidity"
    question: "What A1c target does the care protocol (v2025.1) recommend for an older adult with moderate comorbidity?"
    answer_type: stated fact
    gold: "doc: CP-GLY-TARGETS-2025.1, section Individualized A1c targets"
    expected_facts:
      - "For moderate comorbidity with a 5-10 year life expectancy, the protocol's A1c target range is 7.0-8.0%."
    facts: [F10]
    predictions:
      metric_view: "no: clinical guidance, not a measure"
      closure: "no: clinical guidance, not terminology"
      rag: "yes: stated in the glycemic-targets document"
      genie_ontology: "yes: the HbA1c Page states the same targets"
      graph: "no: prose guidance isn't modeled as triples"

  - id: q5
    short: "eGFR: measures, MY2026 codes, where defined"
    question: "Which measures use eGFR, which LOINC codes count as eGFR in MY2026, and where is that defined?"
    answer_type: stated facts
    gold: bq5_egfr_measures_codes
    expected_facts:
      - "KED (Kidney Health Evaluation) is the measure that uses eGFR."
      - "In MY2026 only LOINC 98979-8 (CKD-EPI 2021) counts as eGFR."
      - "It is defined as the KED_EGFR value set (versioned by measurement year)."
    facts: [F12, F14, F15, F16]
    predictions:
      metric_view: "partial: the KED view names eGFR; not the codes or where the value set lives"
      closure: "codes yes (value_set_segment); which measures, partial (protocol_edges monitoredBy)"
      rag: "codes yes (payer memo); where it is defined in the catalog, no"
      genie_ontology: "yes: the eGFR / Measure Drift Pages, the value-set table and the KED view together"
      graph: "partial: KED monitoredBy LP-EGFR; measure value sets aren't mapped (F15)"

  - id: q6
    short: "Contraindicated on 2026-10-30"
    question: "On 2026-10-30, how many patients had an active order for a drug the care protocol contraindicates for a condition active that day, or for their last lab result on or before that day, and for which drugs?"
    answer_type: count + reasons
    gold: [bq6_contra_active_patients, bq6_contra_active_reasons]
    expected_facts:
      - "67 patients on 2026-10-30."
      - "48 held an active metformin fill with a last eGFR below 30; 11 an active ACE-inhibitor order with a pregnancy active that day; 9 an active statin order with a pregnancy active that day (one patient has both of the last two)."
    facts: [F17, F18, F19, F20, F21, F22, F23, F26, F28]
    predictions:
      metric_view: "no: not a measure"
      closure: "yes, with one hand-written join per rule shape (condition rules and lab rules differ)"
      rag: "rule text only; can't apply it to patients"
      genie_ontology: "context holds the rules and tables; applying them needs multi-step querying"
      graph: "yes once the drug classes, threshold-to-lab edges and observation values are reachable (F22, F23, F26), and the graph carries dates (F28)"

  - id: q7
    short: "Why patient 00040be9 is an SPD gap"
    question: "Why was patient 00040be9-7fcf-0ca1-0263-b4197b8f8d28 in the SPD statin gap for MY2026 (through 2026-10-30)?"
    answer_type: path
    gold: bq7_spd_gap_path
    patient: 00040be9-7fcf-0ca1-0263-b4197b8f8d28
    hero_rule: "lowest patient id among MY2026 SPD gaps whose statin lapsed before 2026"
    expected_facts:
      - "The patient is coded E11.9, a form of type 2 diabetes (E11), so they are in the diabetes cohort."
      - "They are 61, inside SPD's 40-75 window."
      - "No statin was dispensed between 2026-01-01 and 2026-10-30; their only statin record is an open-ended Simvastatin 20 MG order from 2009-11-16."
      - "SPD expects a statin (the care protocol recommends one for SPD), so with none dispensed the patient is a statin care gap."
    facts: [F01, F08, F09, F24]
    predictions:
      metric_view: "the rule, not this patient (no patient dimension)"
      closure: "yes, with joins written for this question"
      rag: "the rule text only"
      genie_ontology: "context for the rule and tables; the patient's path needs querying"
      graph: "yes: a traversal from the patient (eligibleFor, hasDiagnosis -> subClassOf*, prescribed history, recommendedFor)"

  - id: q8
    short: "Outside eye exam for patient 0b4f4745"
    question: "Patient 0b4f4745-1c22-260c-494b-f91aa1e81cfc had an EED gap for MY2026 (through 2026-10-30). Is there any record of a diabetic eye exam outside our EHR?"
    answer_type: stated facts
    gold: bq8_eed_gap_outside_letter
    patient: 0b4f4745-1c22-260c-494b-f91aa1e81cfc
    hero_rule: "lowest patient id among the outside-letter patients with an EHR EED gap"
    run_as: clinician@example.org   # the letter is care-team only (document-level RLS)
    expected_facts:
      - "Yes: an outside consultation letter (Northside Optometry Group, LETTER-EYE-0b4f4745) documents a dilated fundus examination of both eyes on 2026-09-02, with no evidence of diabetic retinopathy."
      - "The exam is not in the EHR, which is why the EED gap shows."
    facts: [F27]
    predictions:
      metric_view: "no: sees only the EHR, so it reports the gap"
      closure: "no: EHR data only"
      rag: "yes: the letter is indexed (care-team access; patient pre-filter)"
      genie_ontology: "no: per-patient correspondence isn't curated into Pages, metadata or knowledge stores"
      graph: "no: per-patient correspondence isn't mapped"
