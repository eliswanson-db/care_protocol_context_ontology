# HEDIS benchmark v2: the locked question set (docs/CONTEXT_LAB_PLAN.md §4a), locked 2026-11-22.
#
# Real analyst questions; no approach is designed to win. `predictions` are what we expect each approach to do,
# to be checked by the runs (step 5), not targets. Every question names a fixed date or period (MY2026 data runs
# through 2026-10-30). Gold answers are hand-verified gold queries in src/benchmark/gold_queries.sql (verify_gold.py
# gate), marked `-- holdout:` so no approach holds them in its context; question 4's gold is a document passage.
# Heroes are chosen by a stated rule, never by hand. `patient` = the patient a question names (RAG may pre-filter on
# rag.documents.patient_id, the standard clinical pattern). `facts` = docs/benchmark/hedis_facts.yaml ids.
#
# tests/test_benchmark_v2.py checks: fixed dates only, every gold id exists and is holdout, every fact id exists, and
# question 8's letter says what its gold says.

# Hand check (2026-11-25, on the final run: 3 runs per cell, graph v7, corrected answer key). Every cell was read
# against gold; the note says what the check found. Where it disagrees with the judge, hand_overrides wins.
# The data's as-of date: nothing is loaded after it. Every approach's agent is told it (ADR-0028).
data_through: "2026-10-30"
hand_verified:
  metric_view: [q1, q2, q3, q4, q5, q6, q7, q8]
  closure_sql: [q1, q2, q3, q4, q5, q6, q7, q8]
  rag: [q1, q2, q3, q4, q5, q6, q7, q8]
  genie_ontology: [q1, q2, q3, q4, q5, q6, q7, q8]
  ontobricks: [q1, q2, q3, q4, q5, q6, q7, q8]
  genie_one: [q1, q2, q3, q4, q5, q6, q7, q8]
hand_overrides:
  ontobricks:
    q7:
      tier: 3
      outcome: incomplete
      note: "Hand check: its query result does state 'STATIN recommendedFor SPD' (expected fact 4; the judge found it in the previous run), so the outcome is incomplete, not found none. Diagnosis, age and dispense dates are missing."
hand_notes:
  metric_view:
    q1: "Correct to decline under the rule, though the view's Poor Control Rate by Clinic is the answer: the agent found no date to apply 'through 2026-10-30' (the data ends there). Answered in 1 of 3 runs."
    q2: "Correct: no single view combines GSD and SPD, and the definitions give no patient key to join them."
    q3: "Correct: no measure is built for this cohort."
    q4: "Correct: clinical guidance isn't a measure."
    q5: "Correct: the KED view says eGFR is required, but holds neither the MY2026 codes nor where they're defined."
    q6: "Correct: metric views are aggregates; there is no patient-level order, condition or lab data to query."
    q7: "Correct: the definitions expose no patient identifier, so one patient's gap can't be explained from them."
    q8: "Correct: the outside letter isn't in any table."
  closure_sql:
    q1: "Correct: closures hold terminology, not A1c results or clinics."
    q2: "Correct: it resolves diabetes and statin subtrees but has no A1c values, ages or dispense dates."
    q3: "Verified: 1,881 under E11.2 or E10.2. No E13.2 code exists, no patient has an E13 diagnosis, and no diagnosis is after 2026-10-30, so the undated count is the answer."
    q4: "Correct: guidance, not terminology."
    q5: "Correct: the closures cover ICD-10 and RxNorm, not LOINC value sets."
    q6: "Correct: contraindication rules and dates are a different relationship from is-a; that's the graph's job."
    q7: "Correct: it returns subtree counts, not one patient's record."
    q8: "Correct: no letters in terminology tables."
  rag:
    q1: "Correct: documents define GSD but hold no patient data."
    q2: "Correct: no patient data in documents."
    q3: "Correct: the protocol names E11.2 / E10.2 / E13.2 but counts no patients."
    q4: "Verified: the Glycemic Targets passage states 7.0–8.0% for moderate comorbidity, 5–10 year life expectancy."
    q5: "Correct as incomplete in substance: the passages state KED and 98979-8, but not where the value set is defined (no document names the table)."
    q6: "Correct: no patient data in documents (top passages were eye-exam letters; retrieval found nothing on contraindications)."
    q7: "Correct: retrieval with the patient filter returned no document for this patient; protocol prose has no dispense history."
    q8: "Verified: the patient's outside letter (Northside Optometry Group, 2026-09-02) states the exam and that it isn't in the EHR. Only RAG holds it."
  genie_ontology:
    q1: "Verified wrong: its query treats an A1c taken during 2026-10-30 as after the cutoff (> DATE'2026-10-30' is after midnight); gold counts through end of day. One patient at CLINIC-06: 109 vs 108 of 272."
    q2: "Correct to decline: nothing Genie retrieved names the age column, so the agent couldn't filter 65–75."
    q3: "Verified: one query on silver_condition (E1_.2%, onset on or before 2026-10-30) returned 1,881."
    q4: "Correct: Genie ranked the HbA1c Page, which holds the 7.0–8.0% target, but read only the care-protocol-rules Page, so the target never reached the context."
    q5: "Verified: the context names KED and value_set_segment; the one query returned only 98979-8 for KED_EGFR in 2026."
    q6: "Verified: the query failed in 1 run, and in the others counted 65 metformin patients (gold 48) because it didn't take each patient's last eGFR result."
    q7: "Verified: the query uses a `status` column gold no longer has. It comes from snippets mined from the deprecated dev dashboard, still served until Genie's snippet index refreshes."
    q8: "Correct: Genie Ontology holds no patient correspondence."
  ontobricks:
    q1: "Correct: patients carry no clinic in the graph (not mapped; fact F07)."
    q2: "Correct to decline: the graph has no dates on dispenses or results, so 'last A1c through 2026-10-30' can't be computed."
    q3: "Correct to decline: hasDiagnosis has no date (fact F28). The structure is there: Condition/E11.22 subClassOf E11.2 and N18."
    q4: "Correct: the graph holds the GSD thresholds (< 8, > 9), not the individualized targets."
    q5: "Verified incomplete: it links KED to eGFR, but the graph has no MY2026 value-set membership (containsTest, fact F15) and no table location."
    q6: "Correct to decline: no dates on orders, conditions or results (fact F28)."
    q7: "Hand check: its query result does state 'STATIN recommendedFor SPD' (expected fact 4; the judge found it in the previous run), so the outcome is incomplete, not found none. Diagnosis, age and dispense dates are missing."
    q8: "Correct: no letters in the graph, by design."
  genie_one:
    q1: "Verified: all eight clinic rates match."
    q2: "Verified: 73."
    q3: "Verified: 1,881, with E11.2 / E10.2 / E13.2 and the date filter."
    q4: "Verified wrong: it searched the protocol-rules table and said targets are uniform. The 7.0–8.0% target is in the protocol document (RAG) and on the HbA1c Page, which it didn't read."
    q5: "Verified: KED, 98979-8 only, and value_set_segment segment KED_EGFR."
    q6: "Verified: 67 patients, 48 metformin / 11 ACE / 9 statin."
    q7: "Verified: E11.9, age 61, no 2026 dispense, an open-ended 2009 Simvastatin order, and the SPD statin rule (correct under the fixed answer key)."
    q8: "Verified wrong, for a structural reason: the letter is only in Lakebase, which Genie One can't reach, so it correctly found no outside record in the tables."

questions:
  - id: q1
    short: "GSD poor control by clinic"
    question: "What was the GSD poor-control rate (last A1c of the year above 9%, or no A1c test) by clinic, for MY2026 through 2026-10-30?"
    answer_type: set of (clinic, rate)
    gold: bq1_gsd_poor_by_clinic
    expected_facts:
      - "GSD poor-control rate by clinic, MY2026 through 2026-10-30: CLINIC-01 37.2%, CLINIC-02 35.3%, CLINIC-03 35.7%, CLINIC-04 37.9%, CLINIC-05 32.6%, CLINIC-06 39.7%, CLINIC-07 36.5%, CLINIC-08 38.3%."
    facts: [F05, F06, F07]
    predictions:
      metric_view: "exact: Poor Control Rate by Clinic is a prebuilt, governed measure"
      closure: "no: closures hold terminology, not measures"
      rag: "no: documents hold no patient data"
      genie_ontology: "context points to the governed view; the rate needs one query"
      graph: "no: patient-to-clinic isn't mapped (F07)"

  - id: q2
    short: "65–75, A1c > 9%, no statin"
    question: "Of GSD-eligible diabetics aged 65-75 in MY2026, how many had a last MY2026 A1c (through 2026-10-30) above 9% and no statin dispensed in MY2026 through 2026-10-30?"
    answer_type: count
    gold: bq2_older_poor_no_statin
    expected_facts:
      - "73 GSD-eligible diabetics aged 65-75 had a last MY2026 A1c above 9% and no statin dispensed in MY2026 (through 2026-10-30)."
    facts: [F05, F06, F08, F09, F26]
    predictions:
      metric_view: "no: it crosses two measures (GSD and SPD); no prebuilt view combines them"
      closure: "partial: the statin class resolves through rxnorm_closure; the A1c values and ages aren't in the closures"
      rag: "no: documents hold no patient data"
      genie_ontology: "context names both gold tables and their rules; the count needs a query"
      graph: "yes once observation values and drug classes are reachable (republish items 1, 3b; F22, F26)"

  - id: q3
    short: "Diabetes with a kidney complication"
    question: "How many patients have diabetes with a kidney complication (a diagnosis on or before 2026-10-30)?"
    answer_type: count
    gold: bq3_kidney_complication
    expected_facts:
      - "1,881 patients have diabetes with a kidney complication (on or before 2026-10-30)."
    facts: [F01, F02]
    predictions:
      metric_view: "no: no measure is built for this cohort"
      closure: "exact: one equality join on icd10_closure"
      rag: "no: documents hold no patient data"
      genie_ontology: "context explains subsumption and the closure table; the count needs a query"
      graph: "yes: subClassOf* walk from the diabetic-kidney roots"

  - id: q4
    short: "A1c target, moderate comorbidity"
    question: "What A1c target does the care protocol (v2025.1) recommend for an older adult with moderate comorbidity?"
    answer_type: stated fact
    gold: "doc: CP-GLY-TARGETS-2025.1, section Individualized A1c targets"
    expected_facts:
      - "For moderate comorbidity with a 5-10 year life expectancy, the protocol's A1c target range is 7.0-8.0%."
    facts: [F10]
    predictions:
      metric_view: "no: clinical guidance, not a measure"
      closure: "no: clinical guidance, not terminology"
      rag: "yes: stated in the glycemic-targets document"
      genie_ontology: "yes: the HbA1c Page states the same targets"
      graph: "no: prose guidance isn't modeled as triples"

  - id: q5
    short: "eGFR: measures, MY2026 codes, where defined"
    question: "Which measures use eGFR, which LOINC codes count as eGFR in MY2026, and where is that defined?"
    answer_type: stated facts
    gold: bq5_egfr_measures_codes
    expected_facts:
      - "KED (Kidney Health Evaluation) is the measure that uses eGFR."
      - "In MY2026 only LOINC 98979-8 (CKD-EPI 2021) counts as eGFR."
      - "The eGFR value set is defined in care_protocol_terminology.value_set_segment, segment KED_EGFR (versioned by measurement year)."
    facts: [F12, F14, F15, F16]
    predictions:
      metric_view: "partial: the KED view names eGFR; not the codes or where the value set lives"
      closure: "codes yes (value_set_segment); which measures, partial (protocol_edges monitoredBy)"
      rag: "codes yes (payer memo); where it is defined in the catalog, no"
      genie_ontology: "yes: the eGFR / Measure Drift Pages, the value-set table and the KED view together"
      graph: "partial: KED monitoredBy LP-EGFR; measure value sets aren't mapped (F15)"

  - id: q6
    short: "Contraindicated on 2026-10-30"
    question: "On 2026-10-30, how many patients had an active order for a drug the care protocol contraindicates for a condition active that day, or for their last lab result on or before that day, and for which drugs?"
    answer_type: count + reasons
    gold: [bq6_contra_active_patients, bq6_contra_active_reasons]
    expected_facts:
      - "67 patients on 2026-10-30."
      - "48 held an active metformin fill with a last eGFR below 30; 11 an active ACE-inhibitor order with a pregnancy active that day; 9 an active statin order with a pregnancy active that day (one patient has both of the last two)."
    facts: [F17, F18, F19, F20, F21, F22, F23, F26, F28]
    predictions:
      metric_view: "no: not a measure"
      closure: "yes, with one hand-written join per rule shape (condition rules and lab rules differ)"
      rag: "rule text only; can't apply it to patients"
      genie_ontology: "context holds the rules and tables; applying them needs multi-step querying"
      graph: "yes once the drug classes, threshold-to-lab edges and observation values are reachable (F22, F23, F26), and the graph carries dates (F28)"

  - id: q7
    short: "Why patient 00040be9 is an SPD gap"
    question: "Why was patient 00040be9-7fcf-0ca1-0263-b4197b8f8d28 in the SPD statin gap for MY2026 (through 2026-10-30)?"
    answer_type: path
    gold: bq7_spd_gap_path
    patient: 00040be9-7fcf-0ca1-0263-b4197b8f8d28
    hero_rule: "lowest patient id among MY2026 SPD gaps whose statin lapsed before 2026"
    expected_facts:
      - "The patient is coded E11.9, a form of type 2 diabetes (E11), so they are in the diabetes cohort."
      - "They are 61, inside SPD's 40-75 window."
      - "No statin was dispensed between 2026-01-01 and 2026-10-30; their only statin record is an open-ended Simvastatin 20 MG order from 2009-11-16."
      - "SPD expects a statin (the care protocol recommends one for SPD), so with none dispensed the patient is a statin care gap."
    facts: [F01, F08, F09, F24]
    predictions:
      metric_view: "the rule, not this patient (no patient dimension)"
      closure: "yes, with joins written for this question"
      rag: "the rule text only"
      genie_ontology: "context for the rule and tables; the patient's path needs querying"
      graph: "yes: a traversal from the patient (eligibleFor, hasDiagnosis -> subClassOf*, prescribed history, recommendedFor)"

  - id: q8
    short: "Outside eye exam for patient 0b4f4745"
    question: "Patient 0b4f4745-1c22-260c-494b-f91aa1e81cfc had an EED gap for MY2026 (through 2026-10-30). Is there any record of a diabetic eye exam outside our EHR?"
    answer_type: stated facts
    gold: bq8_eed_gap_outside_letter
    patient: 0b4f4745-1c22-260c-494b-f91aa1e81cfc
    hero_rule: "lowest patient id among the outside-letter patients with an EHR EED gap"
    run_as: clinician@example.org   # the letter is care-team only (document-level RLS)
    expected_facts:
      - "Yes: an outside consultation letter (Northside Optometry Group, LETTER-EYE-0b4f4745) documents a dilated fundus examination of both eyes on 2026-09-02, with no evidence of diabetic retinopathy."
      - "The exam is not in the EHR, which is why the EED gap shows."
    facts: [F27]
    predictions:
      metric_view: "no: sees only the EHR, so it reports the gap"
      closure: "no: EHR data only"
      rag: "yes: the letter is indexed (care-team access; patient pre-filter)"
      genie_ontology: "no: per-patient correspondence isn't curated into Pages, metadata or knowledge stores"
      graph: "no: per-patient correspondence isn't mapped"
