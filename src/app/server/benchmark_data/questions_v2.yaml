# HEDIS benchmark v2: the locked question set (docs/CONTEXT_LAB_PLAN.md §4a), locked 2026-11-22.
#
# Real analyst questions; no approach is designed to win. `predictions` are what we expect each approach to do,
# to be checked by the runs (step 5), not targets. Every question names a fixed date or period (MY2026 data runs
# through 2026-10-30). Gold answers are hand-verified gold queries in src/benchmark/gold_queries.sql (verify_gold.py
# gate), marked `-- holdout:` so no approach holds them in its context; question 4's gold is a document passage.
# Heroes are chosen by a stated rule, never by hand. `patient` = the patient a question names (RAG may pre-filter on
# rag.documents.patient_id, the standard clinical pattern). `facts` = docs/benchmark/hedis_facts.yaml ids.
#
# An expected fact states the answer only, never the question's own conditions or one store's table name: a wrong
# condition shows up as wrong values, and each approach names where it holds the answer in its own terms.
#
# tests/test_benchmark_v2.py checks: fixed dates only, every gold id exists and is holdout, every fact id exists, and
# question 8's letter says what its gold says.

# Hand check (2026-11-25, protocol v3 final: 3 runs per cell). Every cell's three runs were audited
# (scripts/benchmark_audit.py) and its outcomes read; cells with a specific finding say what the check found;
# the rest quote the harness's explanation. Where the check disagrees with the judge, hand_overrides wins.
hand_verified:
  metric_view: [q1, q2, q3, q4, q5, q6, q7, q8]
  closure_sql: [q1, q2, q3, q4, q5, q6, q7, q8]
  rag: [q1, q2, q3, q4, q5, q6, q7, q8]
  genie_ontology: [q1, q2, q3, q4, q5, q6, q7, q8]
  ontobricks: [q1, q2, q3, q4, q5, q6, q7, q8]
  genie_one: [q1, q2, q3, q4, q5, q6, q7, q8]
hand_overrides:
  ontobricks:
    q7:
      tier: 3
      outcome: incomplete
      note: "Hand check: one 'contradiction' quotes another patient's orders that were in the context; the other reads the patient's open-ended 2009 order -- exactly what the expected fact says -- as contradicting it. The agent did misread that open order as current therapy, so the cell is incomplete, not wrong."
hand_notes:
