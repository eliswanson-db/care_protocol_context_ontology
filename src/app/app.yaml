# Databricks App — Care Protocol Context (read-only throughline visualizer).
# Deploy target workspace sets CARE_ARM (ect|dmvm) + the warehouse. SQL runs as the app service principal;
# add user_api_scopes + OBO later if per-user data scoping is needed.
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: CARE_CATALOG
    value: "eli_test_classic_catalog"
  - name: CARE_MEASUREMENT_YEAR
    value: "2025"
  - name: CARE_ARM
    value: "dmvm"
  - name: CARE_WAREHOUSE_ID
    value: "3abb59fcfb739e0d"          # DMVM "Serverless Starter Warehouse"
  - name: CARE_LAKEBASE_HOST
    value: "ep-divine-wildflower-d2l62zpy.database.us-east-1.cloud.databricks.com"  # DMVM Lakebase
  - name: CARE_GENIE_SPACE_ID
    value: "01f1d63eaf1e148aaca3e207c7499c1a"   # DMVM "Care Protocol — HEDIS Diabetes Quality" space (deployed Genie hop)
  - name: SERVING_ENDPOINT
    value: "databricks-claude-sonnet-5-5"
