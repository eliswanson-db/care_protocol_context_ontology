# Databricks App — Care Protocol Context (read-only throughline visualizer).
# Deploy target workspace sets CARE_ARM (ect|dmvm) + the warehouse. SQL runs as the app service principal;
# add user_api_scopes + OBO later if per-user data scoping is needed.
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Logical config only — NO hardcoded endpoints. The warehouse (by name), the Lakebase host (from the
  # endpoint path), and the Genie space (by title) are all resolved at runtime via the SDK in server/config.py,
  # so this deploys unchanged to any workspace. CARE_ARM is a label; set it per target.
  - name: CARE_CATALOG
    value: "eli_test_classic_catalog"
  - name: CARE_MEASUREMENT_YEAR
    value: "2025"
  - name: CARE_ARM
    value: "dmvm"
