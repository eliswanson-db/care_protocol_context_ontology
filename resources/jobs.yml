# Setup jobs — all bundle-managed. Schemas + volume are declared in schemas.yml / volumes.yml.
# Fresh-workspace setup order:
#   1) setup            (serverless)  load_terminology -> build_closure
#   2) generate_synthea (classic)     stage JAR -> run Synthea -> raw_synthea_* tables
#   3) epicize          (serverless)  SNOMED->ICD-10 crosswalk -> Clarity-shaped bronze_* tables

resources:
  jobs:

    setup:
      name: setup_${bundle.target}
      description: Load vendored terminology (no Drive; ADR-0007) and build the ICD-10 closure.
      tasks:
        - task_key: load_terminology
          spark_python_task:
            python_file: ../src/terminology/load_terminology.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol_terminology"
              - "--src_dir"
              - "${workspace.file_path}/src/terminology"
          environment_key: serverless
        - task_key: build_closure
          depends_on:
            - task_key: load_terminology
          spark_python_task:
            python_file: ../src/semantic/build_closure.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol_terminology"
          environment_key: serverless
        - task_key: build_rxnorm_closure
          depends_on:
            - task_key: load_terminology
          spark_python_task:
            python_file: ../src/semantic/build_closure.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol_terminology"
              - "--hier_table"
              - "rxnorm_hier"
              - "--closure_table"
              - "rxnorm_closure"
              - "--label"
              - "rxnorm_hier"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    generate_synthea:
      name: generate_synthea_${bundle.target}
      description: Stage the pinned Synthea JAR to the Volume, run Synthea (classic JVM), load raw_synthea_* tables.
      job_clusters:
        - job_cluster_key: synthea_classic
          new_cluster:
            # Synthea is a single-JVM Java app (not a Spark workload): it multithreads patient generation
            # across CPU cores on the DRIVER. Workers don't help (they'd sit idle); cores + RAM do. So a big
            # compute-optimized SINGLE node. 16 vCPU generates ~8x the 2-vCPU m5d.large (25k in ~10-15 min).
            spark_version: "15.4.x-scala2.12"
            node_type_id: "c5d.4xlarge"
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            spark_env_vars:
              JNAME: "zulu17-ca-amd64"
            custom_tags:
              ResourceClass: "SingleNode"
            data_security_mode: "SINGLE_USER"
      tasks:
        - task_key: stage_synthea
          job_cluster_key: synthea_classic
          spark_python_task:
            python_file: ../scripts/stage_synthea.py
            parameters:
              - "--volume_dir"
              - "/Volumes/${var.catalog}/care_protocol/synthea"
        - task_key: generate
          depends_on:
            - task_key: stage_synthea
          job_cluster_key: synthea_classic
          spark_python_task:
            python_file: ../src/data_generation/generate_synthea.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
              - "--volume_dir"
              - "/Volumes/${var.catalog}/care_protocol/synthea"
              - "--population"
              - "${var.synthea_population}"
              - "--seed"
              - "20261029"

    epicize:
      name: epicize_${bundle.target}
      description: Crosswalk SNOMED->ICD-10 and shape raw Synthea into Clarity-like bronze_* tables.
      tasks:
        - task_key: epicize
          spark_python_task:
            python_file: ../src/data_generation/epicize_map.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
              - "--src_dir"
              - "${workspace.file_path}/src/terminology"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Generative care-behavior model (ADR-0012). Runs AFTER epicize, BEFORE measures. Gives every cohort
    # patient a seeded behavioral model (latent engagement + REAL comorbidity complexity + provider random
    # effect + seasonality + one panel's mid-year PCP handoff). Follow-up / adherence / control EMERGE from
    # deterministic Bernoulli draws -> continuous, overlapping, confounded variation (no point injection).
    # Writes panel_roster, panel_pcp_transition, and the effective event layer care_order_results/care_order_med.
    care_behavior:
      name: care_behavior_${bundle.target}
      description: Seeded generative care-behavior model — realistic emergent heterogeneity (panels, handoff, adherence).
      tasks:
        - task_key: care_behavior
          spark_python_task:
            python_file: ../src/data_generation/care_behavior.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
              - "--seed"
              - "20261029"
              - "--intensity"
              - "1.0"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Synthesized SSD behavioral-health cohort (ADR-0017). Runs AFTER epicize, BEFORE the `measures` pipeline.
    # Synthea produces no SMI/antipsychotic signal, so SSD's cross-domain cohort (SMI dx F20/F25/F31 +
    # antipsychotic dispensing + glucose/HbA1c screen) is synthesized deterministically (seeded, emergent
    # screening rate — not point injection), analogous to care_behavior. Writes care_ssd_cohort, which the
    # measures pipeline reads to build gold_adherence_ssd. Independent of care_behavior (reads bronze only).
    ssd_cohort:
      name: ssd_cohort_${bundle.target}
      description: Synthesize the SSD behavioral-health cohort (SMI + antipsychotics + screening); emergent + seeded.
      tasks:
        - task_key: ssd_cohort
          spark_python_task:
            python_file: ../src/data_generation/ssd_cohort.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
              - "--seed"
              - "20261029"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Semantic layer (ontology fuel). Runs AFTER the `measures` pipeline — reads gold_adherence_*.
    #   apply_comments:     column-level UC comments on silver/gold/terminology (src/semantic/comments/*.comments.sql)
    #   apply_metric_views: governed UC metric views from src/semantic/metric_views/*.metric_view.sql
    semantic:
      name: semantic_${bundle.target}
      description: Build the governed semantic layer (UC comments + metric views) over gold_* for Genie Ontology.
      tasks:
        - task_key: apply_comments
          spark_python_task:
            python_file: ../src/semantic/apply_comments.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--src_dir"
              - "${workspace.file_path}/src/semantic/comments"
          environment_key: serverless
        - task_key: apply_metric_views
          depends_on:
            - task_key: apply_comments
          spark_python_task:
            python_file: ../src/semantic/apply_metric_views.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
              - "--semantic_schema"
              - "care_protocol_semantic"
              - "--src_dir"
              - "${workspace.file_path}/src/semantic/metric_views"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Render the care-protocol HTML to PDF in the documents Volume (the unstructured lineage anchor).
    stage_care_protocol:
      name: stage_care_protocol_${bundle.target}
      description: Render docs/care_protocol/html/*.html to PDF in /Volumes/<catalog>/care_protocol/documents/pdf.
      tasks:
        - task_key: render
          spark_python_task:
            python_file: ../scripts/render_care_protocol.py
            parameters:
              - "--src_dir"
              - "${workspace.file_path}/docs/care_protocol/html"
              - "--out_dir"
              - "/Volumes/${var.catalog}/care_protocol/documents/pdf"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - xhtml2pdf

    # Stage the Genie Ontology Pages (docs/ontology/pages/*.md) into a UC Volume for Genie Code bulk import.
    # Stage the Pages-ready SOURCE material (facts-only extracts + synthesized corpus) into the second volume
    # `source_documents` for Genie Code Pages bulk import. Facts-only Markdown only (licensing: ADR-0002/0015);
    # raw proprietary PDFs are a documented manual step. Re-runnable.
    stage_source_documents:
      name: stage_source_documents_${bundle.target}
      description: Copy facts-only source Markdown (corpus + source_extracts) into /Volumes/<catalog>/care_protocol/source_documents.
      tasks:
        - task_key: stage_source_documents
          spark_python_task:
            python_file: ../scripts/stage_source_documents.py
            parameters:
              - "--src_dir"
              - "${workspace.file_path}/docs/care_protocol/source_extracts"
              - "--src_dir"
              - "${workspace.file_path}/docs/care_protocol/corpus"
              - "--volume_dir"
              - "/Volumes/${var.catalog}/care_protocol/source_documents"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    stage_pages:
      name: stage_pages_${bundle.target}
      description: Copy the version-controlled Page sources into /Volumes/<catalog>/care_protocol/ontology_pages.
      tasks:
        - task_key: stage_pages
          spark_python_task:
            python_file: ../scripts/stage_pages.py
            parameters:
              - "--src_dir"
              - "${workspace.file_path}/docs/ontology/pages"
              - "--volume_dir"
              - "/Volumes/${var.catalog}/care_protocol/ontology_pages"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Benchmark the Genie Agent (A2) against a ground-truth question set; log accuracy/grounding/latency to MLflow.
    benchmark:
      name: benchmark_${bundle.target}
      description: Benchmark retrieval arms (A2 Genie Agent, A6 supervisor+MCP) to MLflow for comparison (ADR-0004).
      tasks:
        - task_key: arm_a2
          spark_python_task:
            python_file: ../src/benchmark/run_benchmark.py
            parameters:
              - "--arm"
              - "A2"
              - "--space_id"
              - "${resources.genie_spaces.care_protocol_agent.id}"
              - "--questions"
              - "${workspace.file_path}/src/benchmark/benchmark_questions.json"
              - "--experiment"
              - "/Users/eli.swanson@databricks.com/care_protocol_benchmark"
          environment_key: serverless
        - task_key: arm_a6
          spark_python_task:
            python_file: ../src/benchmark/run_benchmark.py
            parameters:
              - "--arm"
              - "A6"
              - "--warehouse_id"
              - "${var.warehouse_id}"
              - "--catalog"
              - "${var.catalog}"
              - "--repo_src"
              - "${workspace.file_path}/src"
              - "--questions"
              - "${workspace.file_path}/src/benchmark/benchmark_questions.json"
              - "--experiment"
              - "/Users/eli.swanson@databricks.com/care_protocol_benchmark"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - databricks-sdk
              - mlflow

    # Weekly Protocol Watch (story hook: "nobody asked; Genie noticed"). Scans gold_protocol_adherence by
    # trigger month for Step-3 drift (censoring-aware, small-N gated) and appends to protocol_watch_findings.
    # That table is what a Genie One SCHEDULED TASK (manual setup — see RUNBOOK) reads to deliver the weekly
    # summary fast + grounded. Schedule is PAUSED (no external notifications wired until Eli approves a target).
    # Run AFTER `measures`. Re-runnable (appends an as-of snapshot each run).
    protocol_watch:
      name: protocol_watch_${bundle.target}
      description: Proactive drift-watch over protocol-STEP adherence; appends findings to protocol_watch_findings.
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: America/Los_Angeles
        pause_status: PAUSED
      tasks:
        - task_key: protocol_watch
          spark_python_task:
            python_file: ../src/watch/protocol_watch.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "care_protocol"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # Query-history seeding (ontology fuel, roadmap S7a). Runs analyst queries on the SQL warehouse so they
    # land in system.query.history. Run AFTER `semantic` (needs the metric views). Re-runnable (read-only).
    seed_query_history:
      name: seed_query_history_${bundle.target}
      description: Run representative analyst queries on the warehouse to seed query history for Genie Ontology.
      tasks:
        - task_key: seed_query_history
          spark_python_task:
            python_file: ../src/semantic/seed_query_history.py
            parameters:
              - "--warehouse_id"
              - "${var.warehouse_id}"
              - "--catalog"
              - "${var.catalog}"
              - "--schema_semantic"
              - "care_protocol_semantic"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - databricks-sdk
