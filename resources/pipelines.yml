# Lakeflow Declarative Pipeline — Silver + Gold HEDIS measures (GSD first; KED/BPD/EED/SPD to follow).
# Reads bronze_* (epicize job) + terminology/closure; writes silver_*/gold_* into catalog.care_protocol.
resources:
  pipelines:
    measures:
      name: care_protocol_measures_${bundle.target}
      catalog: ${var.catalog}
      schema: care_protocol
      serverless: true
      configuration:
        care.catalog: ${var.catalog}
        care.measurement_year: "2025"
      libraries:
        - file:
            path: ../src/pipelines/measures.py
