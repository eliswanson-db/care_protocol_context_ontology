# Databricks App — the demo UI (Tracer Journey · Retrieval Arena · Benchmark Scorecard · Drift Lab ·
# Ontology Explorer). Net-new React+FastAPI (ADR-0003, app-framework-react-fastapi). Workspace-local, so it
# deploys per target; CARE_ARM in src/app/app.yaml labels the arm. The SQL-warehouse resource grants the app
# service principal CAN_USE; the SP still needs UC SELECT on the care_protocol* schemas (granted post-deploy).
resources:
  apps:
    care_protocol_app:
      name: care-protocol-context-${bundle.target}
      description: Care Protocol Context — read-only throughline visualizer over the shared catalog.
      source_code_path: ../src/app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
