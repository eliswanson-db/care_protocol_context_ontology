# Genie Agent (A2) — bundle-managed via the native genie_spaces resource (DAB).
# The serialized space body lives in resources/care_protocol.geniespace.json (version-controlled).
# Scoped to the Gold measure tables + metric views, with instructions that teach MEASURE() usage.
# NOTE: table/metric-view identifiers in the .geniespace.json are the fixed ECT catalog (ADR-0001);
# a different catalog requires editing that file (genie_spaces file_path is not variable-substituted).
resources:
  genie_spaces:
    care_protocol_agent:
      title: Care Protocol — HEDIS Diabetes Quality (${bundle.target})
      description: >-
        Curated Genie Agent over the Care Protocol semantic layer: GSD and KED measure results
        (gold_adherence_*) and their governed metric views. HEDIS-aligned demo, not NCQA-certified.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/eli.swanson@databricks.com/genie_spaces
      file_path: ./care_protocol.geniespace.json

    # Protocol Process & Medication Adherence agent (the biggest coverage gap per the Genie One review):
    # care-PROCESS adherence (Step-3 follow-up) + MAD, with panel / handoff / protocol-watch context — the
    # agent that answers "which clinic has the lowest Step-3 adherence?". Scoped separately from the HEDIS
    # outcome agent on purpose (keeps each space's examples dense and on-topic). Body: protocol_adherence.geniespace.json.
    protocol_adherence_agent:
      title: Care Protocol — Protocol Process & Medication Adherence (${bundle.target})
      description: >-
        Curated Genie Agent over diabetes care-PROCESS adherence: Protocol Step-3 follow-up and Medication
        Adherence (MAD), with panel, PCP-handoff, and weekly protocol-watch context. Answers clinic/panel
        drift questions. HEDIS-aligned demo, not NCQA-certified.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/eli.swanson@databricks.com/genie_spaces
      file_path: ./protocol_adherence.geniespace.json

    # Cohort & Terminology agent (AG-3 from the Genie One review): the vocabularies and curated code sets
    # BEHIND the measures -- ICD-10 subsumption, RxNorm ingredient->drug, LOINC multiaxial Parts, versioned
    # value sets, and the care-protocol edge graph. Self-contained over care_protocol_terminology.* (no
    # patient data), scoped separately from the outcome/process agents to keep each space's examples dense
    # and on-topic (per the review). Body: terminology.geniespace.json.
    terminology_agent:
      title: Care Protocol — Cohort & Terminology (${bundle.target})
      description: >-
        Curated Genie Agent over the clinical terminology layer: ICD-10-CM hierarchy/closure (cohort
        subsumption), RxNorm ingredient->clinical-drug closure, LOINC multiaxial Parts (component/system/
        method), versioned HEDIS value sets, and the care-protocol knowledge-edge graph. Answers
        definition/code-set questions, not patient counts. HEDIS-aligned demo, not NCQA-certified.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/eli.swanson@databricks.com/genie_spaces
      file_path: ./terminology.geniespace.json

    # LOINC Lab Measures agent (AG-2 from the Genie One review): lab RESULTS -- volume, patients tested, and
    # values -- grouped by LOINC multiaxial concept, over the lab_result_metrics metric view (MV-2). Consumes
    # the governed view so lab counts match the HEDIS numerators (A1c Patients Tested = 9,709 = the class-3
    # gold). Scoped separately from the outcome / terminology agents. Body: lab_measures.geniespace.json.
    lab_measures_agent:
      title: Care Protocol — LOINC Lab Measures (${bundle.target})
      description: >-
        Curated Genie Agent over laboratory RESULTS: test volume, patients tested, and result values grouped
        by LOINC multiaxial concept (component / system / method) via the governed lab_result_metrics view.
        Answers 'how many patients were tested for X regardless of method' and result-value questions.
        HEDIS-aligned demo, not NCQA-certified.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/eli.swanson@databricks.com/genie_spaces
      file_path: ./lab_measures.geniespace.json
