    rule: ELIG-A-V1
    eligible: true
    criteria:
      INC-BMI: {outcome: MET, evidence_mh: 1, path: ["MONDO:0005439", "MONDO:0001336", "MONDO:0021187"]}
    deviations: []
    fas: true
    pps: true
