[project]
name = "care-protocol-context-ontology"
version = "0.0.1"
description = "HEDIS Context & Evidence Lab — semantics/ontology/context demo on Databricks"
requires-python = ">=3.10"
dependencies = [
  # Pinned to match the vendored Genie GenAI Evals notebook (verify in-workspace)
  "mlflow[databricks]==3.17.2",
  "databricks-sdk==0.157.0",
  "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# A4 Lakebase RAG retriever (src/retrieval/a4_lakebase.py) + live doc-RLS test.
lakebase = ["psycopg[binary]>=3.1"]
# Retrieval-science eval harness (src/benchmark/retrieval_eval): FMAPI agent client + MLflow GenAI judges.
eval = ["openai", "httpx", "pyyaml", "psycopg[binary]>=3.1"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
