# Life-sciences benchmark: the LOCKED question set (docs/CONTEXT_LAB_PLAN.md §4b step 4; the HEDIS counterpart is
# questions_v2.yaml), locked 2026-11-23 by Eli. Drafted 2026-11-12, reviewed with Eli (decision 5, plus question 9
# from the monitoring reports); question 8 replaced on 2026-11-23 when the Amendment 3 draft was retired.
#
# Real analyst questions; no approach is designed to win. `predictions` are what we expect each approach to do,
# checked by the runs (step 5), not targets. Every question names the data cutoff, 2026-10-31. Gold answers are
# holdout queries in src/benchmark/ls_gold_queries.sql (verify_gold.py --gold ... gate), or a document passage for
# the document questions. Participants are picked by a stated rule, never by hand. `facts` = ls_facts.yaml ids.
#
# An expected fact states the answer only, never the question's own conditions (the rule, the subgroup): a wrong
# condition shows up as wrong values.
#
# tests/test_ls_benchmark.py checks: the cutoff named and no relative dates, every gold id exists and is holdout,
# every fact id exists, the holdouts never reach a Genie space, and the document golds say what they claim.

# Hand check (2026-11-25, protocol v3 final: 3 runs per cell). Every cell's three runs were audited
# (scripts/benchmark_audit.py) and its outcomes read; cells with a specific finding say what the check found;
# the rest quote the harness's explanation. Where the check disagrees with the judge, hand_overrides wins.
hand_verified:
  metric_view: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
  closure_sql: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
  rag: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
  genie_ontology: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
  ontobricks: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
  genie_one: [lq1, lq2, lq3, lq4, lq5, lq6, lq7, lq8, lq9]
hand_overrides:
  ontobricks:
    lq1:
      tier: 2
      outcome: one_query
      note: "Hand check: runs 1 and 2 both return −12.66 / −2.30 for arm codes CSL101 / PBO over EndpointResult percentChange (R2); the judge rejected run 2 over arm naming (CSL101 vs 'CSL-101 10 mg'). Answered in 2 of 3 runs."
    lq5:
      tier: 3
      outcome: incomplete
      note: "Hand check: it describes where body weight sits in the graph (WeightObservation, DSS WEIGHT) instead of SDTM VS / VSSTRESN; that is incomplete, not a contradiction."
hand_notes:
  metric_view:
    lq1: "Verified: MEASURE(Mean Percent Change) by Arm for CSL-A, protocol 2.0, = −12.66 / −2.30 in 2 of 3 runs; run 1 used base column names (STUDYID) and failed."
    lq2: "Audited (no_query, no_query, no_query): The retrieved metric views lack any baseline BMI column, so the agent couldn't subset or compute the mean percent change. Agent: “no column or table providing baseline BMI is exposed in the context.”"
    lq3: "Audited (no_query, no_query, no_query): The retrieved metric views (endpoint_result, endpoint_candidate, participant_population) lack any medical-history or comorbidity column, so no query could be run. Agent: “no table or column with participant medical history (comorbidities) is named in the context.”"
    lq4: "Audited (no_query, no_query, no_query): The amendment_impact_metrics view describes the ±7-to-±14-day window change but omits the 2025-10-27 effective date and OSA addition. Agent: “context describes the Amendment 1 rule change (±7-day to ±14-day window) but no table or column giving the effective date it took effect.”"
    lq5: "Audited (no_query, no_query, no_query): Retrieved endpoint-rule metric views but lacked any VS domain/VSSTRESN storage or unit details, so the agent declined to query. Agent: “the context names no column or table giving the storage location/unit of the body-weight analysis value (e.g., no AVAL/unit field or table description is provided).”"
    lq6: "Audited (no_query, no_query, no_query): The retrieved views (participant_population_metrics, endpoint_result_metrics, amendment_impact_metrics) lack any medication/GLP-1 column, so no query was possible. Agent: “no table or column with medication (concomitant medication / GLP-1 / appetite suppressant) data is named.”"
    lq7: "Audited (not_found, no_query, no_query): The SQL query found PPSFL=N and reconciliation=ENROLLED_BUT_RULE_INELIGIBLE but omitted the specific EXC-MH pancreatitis criterion."
    lq8: "Audited (no_query, no_query, no_query): The retrieved metric views lack BMI values and comorbidity data, so no query could identify Amendment 1 qualifiers. Agent: “no table or column exposes participant BMI values or the specific weight-related comorbidity (e.g., obstructive sleep apnea) used to satisfy the BMI inclusion criterion.”"
    lq9: "Audited (no_query, no_query, no_query): The retrieved YAML views (amendment_impact_metrics, endpoint_result_metrics, endpoint_candidate_metrics) contain no monitoring-visit text explaining SITE-118's Week 24 delay. Agent: “no table or view containing monitoring visit reports or free-text explanations for SITE-118's Week 24 visit delays is named in the context.”"
  closure_sql:
    lq1: "Verified miss: the query filtered rule_version = 'EP-A-WT24.R2', but that column holds 'R2' (the id is endpoint_version). The table cards give column names, not example values."
    lq2: "Verified miss: the same rule_version filter returned no rows."
    lq3: "Verified: 3,123 from the WRC-V1 roots minus carve-outs, joined to randomized CSL-A participants."
    lq4: "Verified: the linked study_version row states both Amendment 1 changes and 2025-10-27."
    lq5: "Audited (incomplete, query_failed, incomplete): The SQL join across silver_vs and rule_version/study_version returned zero rows, so no weight location, unit, or rule version was confirmed."
    lq6: "Verified: 20 / 40 in run 0; runs 1–2 returned no rows. Not a majority."
    lq7: "Verified: the participant's MH code rolled up through the closure (MONDO:0006515 → MONDO:0004982) and the EXC-MH class root."
    lq8: "Verified miss: its BMI-and-criteria query returned 0 (gold 60)."
    lq9: "Audited (no_query, no_query, no_query): This approach only resolves disease/drug concepts to ontology nodes and has no table of monitoring visit reports to explain SITE-118's late Week 24 visits. Agent: “no table containing monitoring visit reports or reasons for late visits is named in the context.”"
  rag:
    lq1: "Audited (no_query, no_query, no_query): The retrieved monitoring visit reports lack any body weight or SAP v2.0-rule data, so the agent declined to query. Agent: “The context contains only monitoring visit reports, not any table with patient-level body weight or percent-change-from-baseline data or an analysis-rule (SAP v2.0/'protocol 2.0') definition.”"
    lq2: "Audited (no_query, no_query, no_query): The retrieved monitoring visit reports contain no patient-level weight, BMI, arm, or analysis-set data, so no query was possible. Agent: “no table with patient-level body weight, BMI, arm, or analysis-set data is named in the context.”"
    lq3: "Audited (no_query, no_query, no_query): The retrieved passages lack any participant-level comorbidity or medical history data needed to count the 3,123 total. Agent: “no table with participant medical history / comorbidity data or protocol 1.0 section 5.1 definitions is named in the context.”"
    lq4: "Audited (no_query, no_query, no_query): The five retrieved monitoring visit reports contain no mention of Amendment 1's content or effective date, so the agent found nothing. Agent: “no table or document content describing CSL-A Amendment 1's changes or effective date is present in the context.”"
    lq5: "Audited (no_query, no_query, no_query): Retrieved only monitoring visit reports and an unrelated SAP, lacking VS domain, VSSTRESN unit, or EP-A-WT24.R2 details. Agent: “no table/view, column, or endpoint-rule-version information is provided for CSL-A standardized body weight data.”"
    lq6: "Audited (no_query, no_query, no_query): The retrieved monitoring reports only contain narrative deviation excerpts, lacking any aggregated per-arm medication-start counts. Agent: “No table/view with participant-level arm assignment or medication start dates is named; only free-text monitoring report excerpts are provided.”"
    lq7: "Audited (no_query, no_query, no_query): The retrieved monitoring reports cover sites 103, 139, and 137 but never mention participant CSL-A-103-0137's eligibility violation or pancreatitis diagnosis. Agent: “The context contains no table/view with per-protocol set exclusion reasons for participant CSL-A-103-0137.”"
    lq8: "Audited (no_query, no_query, no_query): The retrieved passages explain Amendment 1's OSA rationale but lack participant-level BMI/comorbidity data needed to compute the count of 60. Agent: “no table with participant-level screening BMI, comorbidity, or eligibility data is named in the context.”"
    lq9: "Audited (no_query, no_query, no_query): The retrieved reports (2026-03-24 to 2026-07-24) omit the 2025-09-18 report's spreadsheet-miscalculation explanation for the late Week 24 visits. Agent: “no table/view with monitoring visit report findings/narrative text is named in the context.”"
  genie_ontology:
    lq1: "Verified: one query on endpoint_result_metrics (Rule Version R2) = −12.66 / −2.30."
    lq2: "Audited (no_query, no_query, no_query): The retrieved snippets and Pages lacked any baseline BMI column, so the agent declined to query, leaving the BMI≥35 result missing entirely. Agent: “No column or table in the context provides baseline BMI for participants, so a BMI≥35 filter cannot be constructed.”"
    lq3: "Audited (no_query, no_query, no_query): The agent found the WRC-V1/V2 definition page but had no table linking participants' diagnoses to MONDO codes, so it declined to query and never produced the 3,123 count. Agent: “no table linking CSL-A participants' medical history diagnoses to MONDO concept codes is named in the context.”"
    lq4: "Verified: the Protocol amendments Page states both changes and 2025-10-27."
    lq5: "Verified: the dataset-guide and unit Pages state silver_vs WEIGHT, VSSTRESN kg, and R2."
    lq6: "Audited (no_query, no_query, no_query): The agent declined to query, having only prohibited-medication and protocol Pages but no tables for first-dose dates, arm assignment, or concomitant-medication start dates. Agent: “no table/column is identified for CSL-A participant first-dose dates, arm assignment, or concomitant-medication start dates needed to detect prohibited medications started on or after first dose.”"
    lq7: "Audited (no_query, no_query, no_query): The agent found Pages on general exclusion rules but had no table/column linking CSL-A-103-0137 to its EXC-MH pancreatitis deviation. Agent: “no table or column is named that records the specific per-protocol-set exclusion reason for an individual participant like CSL-A-103-0137.”"
    lq8: "Audited (no_query, no_query, no_query): The agent declined to query, lacking participant-level BMI, screening date, and comorbidity data needed to compute the 60-participant count. Agent: “No table in the context provides participant-level screening date, BMI value, or diagnosis/comorbidity data needed to identify which CSL-A participants had BMI 27–30 and qualified only via the Amendment 1 OSA addition.”"
    lq9: "Audited (no_query, no_query, no_query): The retrieved snippets and Pages lack any identifier for SITE-118 or the spreadsheet miscalculation explaining the late visits. Agent: “no table or column in the context identifies \"SITE-118\" or provides monitoring visit report reasons for late visits.”"
  ontobricks:
    lq1: "Hand check: runs 1 and 2 both return −12.66 / −2.30 for arm codes CSL101 / PBO over EndpointResult percentChange (R2); the judge rejected run 2 over arm naming (CSL101 vs 'CSL-101 10 mg'). Answered in 2 of 3 runs."
    lq2: "Audited (not_found, no_query, no_query): The SQL joined derivedUnder, baselineKg, and height filters but returned zero rows, missing CSL-101 −12.74% vs placebo −2.30%."
    lq3: "Verified wrong: 5,627 (not 3,123): didn't restrict to CSL-A or subtract the WRC-V1 carve-outs."
    lq4: "Verified: StudyVersion/CSL-A.P2.0 changeSummary and effectiveDate in 2 of 3 runs."
    lq5: "Hand check: it describes where body weight sits in the graph (WeightObservation, DSS WEIGHT) instead of SDTM VS / VSSTRESN; that is incomplete, not a contradiction."
    lq6: "Verified: 20 / 40 in all 3 runs via ConMedRecord startDate vs firstDoseDateTime and drug memberOf / hasPhysiologicEffect."
    lq7: "Verified incomplete: it found the deviation (violatesCriterion EXC-MH) and the coded MH, but didn't walk subClassOf to the root."
    lq8: "Audited (no_query, one_query, no_query): The subgraph had concept/comorbidity links but no participant-level BMI or weight/height data, so the agent declined to query and returned nothing. Agent: “no participant-level BMI value or screening-visit weight/height observation (with a known \"Screening\" visit code) is provided to compute each participant's BMI.”"
    lq9: "Audited (no_query, no_query, no_query): The subgraph retrieved only EndpointDefinition/Site linkage and FAS population triples, lacking any monitoring visit report or lateness narrative. Agent: “no monitoring visit report data or narrative fields about visit lateness/reasons are present in the context.”"
  genie_one:
    lq1: "Audited (in_context, in_context, in_context): Genie One's own answer states both arm values directly, matching the gold figures exactly."
    lq2: "Audited (in_context, in_context, in_context): Genie One's answer directly states CSL-101 −12.74% and placebo −2.30%, matching the gold facts."
    lq3: "Audited (in_context, in_context, in_context): Genie One's answer directly stated the exact figure, 3,123 participants, matching the gold value."
    lq4: "Audited (in_context, in_context, in_context): The retrieved document's table row directly states both Amendment 1 changes and the 2025-10-27 effective date."
    lq5: "Audited (in_context, in_context, in_context): Genie One's answer directly states all three facts: silver_vs with VSTESTCD=WEIGHT, VSSTRESN in kg, and EP-A-WT24.R2."
    lq6: "Audited (in_context, in_context, in_context): Genie One's own answer states CSL-101 20 and placebo 40, matching all gold facts."
    lq7: "Audited (in_context, in_context, in_context): Genie One's answer directly states the EXC-MH eligibility violation and acute pancreatitis-to-pancreatitis subsumption from the retrieved documents."
    lq8: "Audited (in_context, in_context, in_context): Genie One's answer directly states the 60-participant figure, matching the gold fact from its retrieved documents."
    lq9: "Verified wrong, structural: the monitoring reports are only in Lakebase, which Genie One can't reach."

questions:
  - id: lq1
    short: "Week 24 % change by arm (R2)"
    question: "In CSL-A, what was the mean percent change in body weight from baseline to Week 24, by arm, under the protocol 2.0 rule (SAP v2.0), for data through 2026-10-31?"
    answer_type: set of (arm, mean)
    gold: lq1_wt24_by_arm
    expected_facts:
      - "CSL-101 10 mg −12.66%, placebo −2.30%."
    facts: [LF01, LF02, LF03, LF05]
    predictions:
      metric_view: "exact: Mean Percent Change by Arm and Rule Version is a prebuilt governed measure"
      closure: "no: closures hold terminology, not results"
      rag: "no: documents hold no participant data"
      genie_ontology: "context points to the governed view and the rule version; the mean needs one query"
      graph: "possible if results and arms are mapped (0b), with aggregation"

  - id: lq2
    short: "Same, baseline BMI ≥ 35"
    question: "Among CSL-A full-analysis-set participants with a baseline BMI of 35 or more, what was the mean percent change in body weight from baseline to Week 24, by arm, under the protocol 2.0 rule, for data through 2026-10-31?"
    answer_type: set of (arm, mean)
    gold: lq2_wt24_bmi35_by_arm
    expected_facts:
      - "CSL-101 −12.74%, placebo −2.30%."
    facts: [LF01, LF05, LF07]
    predictions:
      metric_view: "no: BMI is not a dimension of any view"
      closure: "no: closures hold terminology"
      rag: "no: documents hold no participant data"
      genie_ontology: "context says where height is and that BMI is calculated; needs a query joining results to height"
      graph: "possible if baseline weight and height observations are mapped (0b), with arithmetic"

  - id: lq3
    short: "Randomized with a weight-related comorbidity"
    question: "How many randomized CSL-A participants (through 2026-10-31) have at least one weight-related comorbidity, as protocol 1.0 section 5.1 defines them, in their medical history?"
    answer_type: count
    gold: lq3_wrc_v1_randomized
    expected_facts:
      - "3,123 randomized CSL-A participants have at least one weight-related comorbidity under the protocol 1.0 definition."
    facts: [LF08, LF09]
    predictions:
      metric_view: "no: no comorbidity dimension"
      closure: "exact: mondo_closure under the WRC-V1 roots minus the carve-outs, joined to medical history"
      rag: "no: documents hold no participant data"
      genie_ontology: "context explains the class and the closure table; the count needs a query"
      graph: "yes if MH terms and the MONDO subClassOf hierarchy are mapped (0b)"

  - id: lq4
    short: "What Amendment 1 changed"
    question: "What did CSL-A Amendment 1 change, and from what date?"
    answer_type: stated fact
    gold: "doc: CSL-A-PROT-AMD1, section 1 Summary of changes"
    expected_facts:
      - "Amendment 1 (protocol version 2.0) is effective 2025-10-27 and makes two changes: the Week 24 analysis window widens from ±7 to ±14 days around the target date (SAP version 2.0, section 9.4.1), and obstructive sleep apnea is added to the weight-related comorbidities for participants screened on or after the effective date."
    facts: [LF03, LF04]
    predictions:
      metric_view: "no: an amendment is a document, not a measure"
      closure: "partial: study_version holds the effective date and change summary"
      rag: "exact: the amendment document states both changes and the date"
      genie_ontology: "exact: the Protocol amendments Page"
      graph: "partial if study versions are mapped (0b)"

  - id: lq5
    short: "Where body weight is stored, unit, rule version"
    question: "In the CSL-A standardized data, where is body weight stored, in what unit is the analysis value, and which endpoint rule version governs Week 24 results for data through 2026-10-31?"
    answer_type: stated fact
    gold: "doc: CSL-DMS-v1.0 section 2.1-2.2 + CSL-A-SAP-v2.0 section 9.4.1"
    expected_facts:
      - "Body weight is in the SDTM VS domain (silver_vs) with VSTESTCD = WEIGHT."
      - "The analysis value is VSSTRESN, in kg."
      - "Week 24 results are governed by EP-A-WT24.R2 (protocol 2.0 / SAP 2.0)."
    facts: [LF04, LF06]
    predictions:
      metric_view: "partial: Rule Version is a dimension; storage and units are not"
      closure: "partial: rule_version and study_version tables"
      rag: "yes: the data management specification and the SAP"
      genie_ontology: "exact: the dataset guide, unit normalization and endpoint Pages"
      graph: "partial if observations and rule versions are mapped (0b)"

  - id: lq6
    short: "Prohibited drug started on treatment"
    question: "How many CSL-A participants started a medication the protocol prohibits (a GLP-1 receptor agonist or an appetite suppressant) on or after their first dose, through 2026-10-31, by arm?"
    answer_type: set of (arm, count)
    gold: lq6_prohibited_on_treatment_by_arm
    expected_facts:
      - "CSL-101 20, placebo 40."
    facts: [LF10, LF11]
    predictions:
      metric_view: "partial: Participants With Major Deviation by Arm counts all major deviations, not only medications"
      closure: "exact: MED-RT memberOf / has_PE over coded concomitant medications, with dates"
      rag: "no: documents hold no participant data"
      genie_ontology: "context names the classes and tables; the count needs a query"
      graph: "yes if medications, their MED-RT classes and dates are mapped (0b): drug → class multi-hop"

  - id: lq7
    short: "Why CSL-A-103-0137 left the PPS"
    question: "Why was participant CSL-A-103-0137 excluded from the CSL-A per-protocol set (data through 2026-10-31)?"
    answer_type: explanation with a path
    participant_rule: "the lowest CSL-A USUBJID in the FAS but not the PPS whose only major deviation is an eligibility violation, through an exclusionary-history term reached through the MONDO hierarchy (not the root itself)"
    gold: "data: gold_eligibility_criterion path for the participant (checked against silver_mh + mondo_closure)"
    expected_facts:
      - "CSL-A-103-0137 is out of the per-protocol set because of a major protocol deviation: an eligibility violation (the exclusionary-history criterion, EXC-MH)."
      - "Their medical history records acute pancreatitis (MONDO:0006515), which is a form of pancreatitis (MONDO:0004982), an exclusionary-history root."
    facts: [LF05, LF09, LF12, LF13]
    predictions:
      metric_view: "no: the views count, they don't explain one participant"
      closure: "yes: the MH term's MONDO ancestors reach an EXCL-MH-V1 root"
      rag: "partial: the protocol names the exclusion; not the participant's history"
      genie_ontology: "context explains the classes and the deviation rule; the path needs queries"
      graph: "yes if MH terms and the MONDO hierarchy are mapped (0b): the path is the answer"

  - id: lq8
    short: "Qualified only because of sleep apnea"
    question: "How many CSL-A participants screened from 2025-10-27 through 2026-10-31 had a BMI of 27 to under 30 and met the BMI inclusion criterion only because Amendment 1 added obstructive sleep apnea as a weight-related comorbidity?"
    answer_type: count
    gold: lq8_osa_only_qualified
    expected_facts:
      - "60 CSL-A participants screened from 2025-10-27 had a screening BMI of 27 to under 30, obstructive sleep apnea in their history and no weight-related comorbidity from the protocol 1.0 list: they met the BMI criterion only because of Amendment 1."
    facts: [LF04, LF07, LF08, LF13, LF14]
    predictions:
      metric_view: "no: no comorbidity dimension"
      closure: "exact: the difference of the WRC-V2 and WRC-V1 subtrees, with screening dates and BMI"
      rag: "no: documents hold no participant data"
      genie_ontology: "context states the amendment and the class; the count needs a query"
      graph: "yes if MH terms, the hierarchy and screening data are mapped (0b)"

  - id: lq9
    short: "Why SITE-118's Week 24 visits were late"
    question: "Why were SITE-118's Week 24 visits late, according to the monitoring visit reports through 2026-10-31?"
    answer_type: explanation
    gold: "doc: MVR-SITE-118-06 (triggered monitoring visit, 2025-09-18), section 6"
    expected_facts:
      - "The site's visit-calculator spreadsheet computed the Week 24 visit as 25 weeks after first dose (study day 176) instead of study day 169, and visits were then booked into the next free research-clinic slot; recorded at the triggered monitoring visit of 2025-09-18."
    facts: [LF15]
    predictions:
      metric_view: "no: an explanation is not in any table"
      closure: "no"
      rag: "yes if the report that records the cause ranks in the top k; later follow-up reports only point back to it"
      genie_ontology: "no: monitoring reports are not curated context"
      graph: "no: free-text reports are not mapped"
