    graph: {s: ValueSet/CONTRA_PREGNANCY, p: contains, o: icd/Z34}

  - id: F22
    fact: "Metformin is a biguanide (every drug belongs to its drug class)."
    questions: [q9]
    metric_view: {none: "no drug classes in metric views"}
    closure: {table: rxnorm_closure, where: "ancestor_code = 'DRUGCLASS-BIGUANIDE'"}
    rag: {file: docs/care_protocol/html/diabetes_care_protocol.html, has: ["Metformin"]}
    genie_ontology: {file: docs/ontology/pages/mad.md, has: ["biguanide"]}
    graph: {gap: "inDrugClass exists only for statins (3 edges); republish with every class (ONTOBRICKS_REPUBLISH Path B, fix 1)"}

  - id: F23
    fact: "The eGFR thresholds (eGFR_LT_30, eGFR_LT_20) apply to the eGFR test."
    questions: [q9]
    metric_view: {none: "clinical rule, not a measure"}
    closure: {none: "implicit in the threshold id only (protocol_edges object 'eGFR_LT_30', value 30)"}
    rag: {file: docs/care_protocol/html/diabetes_care_protocol.html, has: ["eGFR &lt; 30", "mL/min/1.73m"]}
    genie_ontology: {file: docs/ontology/pages/care-protocol-rules.md, has: ["eGFR below 30"]}
    graph: {gap: "Threshold/eGFR_LT_30 has no edge to part/LP-EGFR, so a traversal can't compare it with a patient's eGFR; map Threshold -> LoincPart"}

  - id: F24
