    questions: [q8, q9]
    metric_view: {none: "metric views aggregate results; they don't describe the feed"}
    closure: {none: "lab feed history isn't terminology"}
    rag: {none: "the documents don't describe this lab's feed"}
    genie_ontology: {file: docs/ontology/pages/egfr.md, has: ["2022-07-01"]}
    graph: {gap: "v3 was published before the 2026-11-21 reflow, so its eGFR observations still use 33914-3; republish"}
