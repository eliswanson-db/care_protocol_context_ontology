    metric_view: {file: src/semantic/metric_views/spd_compliance.metric_view.sql, has: ["Gap Reason"]}
    closure: {none: "closures hold terminology; patient facts are in silver/gold"}
    rag: {none: "patient records aren't documents (one outside letter is, by design)"}
    genie_ontology: {none: "Genie Ontology retrieves context; patient rows come from querying gold"}
