    rag: {file: docs/care_protocol/html/diabetes_care_protocol.html, has: ["contraindicated when eGFR &lt; 30"]}
    genie_ontology: {file: docs/ontology/pages/care-protocol-rules.md, has: ["eGFR below 30"]}
    graph: {s: DrugClass/DRUGCLASS-BIGUANIDE, p: contraindicatedWhen, o: Threshold/eGFR_LT_30}

