# Databricks Asset Bundle (DAB) — HEDIS Context & Evidence Lab
# Validate:  databricks bundle validate -t ect --profile ECT   |   -t dmvm --profile DMVM
# Deploy:    databricks bundle deploy   -t ect --profile ECT   |   -t dmvm --profile DMVM
# Two workspaces, ONE shared catalog (ADR-0018): ect = ontology-OFF baseline, dmvm = ontology-ON arm.
bundle:
  name: care_protocol_context_ontology

variables:
  catalog:
    description: Unity Catalog holding all demo assets (ADR-0001). ONE catalog, shared READ_WRITE by ECT + DMVM in the same metastore (ADR-0018) — both targets point at it; data + modeled metadata are built once and read by both. Only the workspace-level native-ontology layer differs.
    default: eli_test_classic_catalog
  schema:
    description: Default schema for pipeline + semantic assets
    default: care_protocol
  synthea_population:
    description: Number of synthetic patients Synthea generates (scaled up for a serious benchmark).
    default: "25000"
  warehouse_id:
    description: SQL warehouse for the Genie agent, resolved by name (FEVM default warehouse). Override via --var if absent.
    lookup:
      warehouse: "Serverless Starter Warehouse"
  embedding_endpoint:
    description: Foundation Model embedding endpoint (ECT)
    default: databricks-gte-large-en
  llm_endpoint:
    description: Chat/LLM endpoint for agents + judges (ECT)
    default: databricks-claude-sonnet-5-5

# Included resources are either target-suffixed (jobs/pipelines named *_${bundle.target}) or workspace-local
# (dashboards, Genie spaces), so they are safe to deploy to every target over the shared catalog.
# DELIBERATELY NOT globbed here: resources/schemas.yml + resources/volumes.yml. Those manage UNSUFFIXED UC
# objects (the care_protocol* schemas + their volumes) that live in the ONE shared catalog. A second production
# target (dmvm) over the same catalog would, in its own Terraform state, try to CREATE schemas that already
# exist (ECT owns them) and a future `bundle destroy -t dmvm` could DROP the shared schemas + all the data.
# So the shared-UC resources are attached to dev + ect ONLY, via the &shared_uc anchor below (ADR-0019).
include:
  - resources/apps.yml
  - resources/dashboards.yml
  - resources/genie_spaces.yml
  - resources/jobs.yml
  - resources/pipelines.yml

# The built SPA (src/app/frontend/dist) is gitignored, but the deployed App must serve it — force it into the
# bundle sync. Build it first: `cd src/app/frontend && npm run build`.
sync:
  include:
    - src/app/frontend/dist/**
  # The vendored Genie GenAI Evals archive (ADR-0004) is a local reference, not a job input. An earlier deploy
  # imported it as a notebook; uploading the .dbc again collides with that object, so it is not synced.
  exclude:
    - "src/benchmark/*.dbc"

targets:
  # Local/iterative development (isolated, prefixed deployments). Dev mode prefixes the schema/volume names,
  # so dev owns its own dev_<user>_care_protocol* schemas — no collision with the production catalog objects.
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-eli-test-classic.cloud.databricks.com   # profile: ECT
    # --- shared catalog-scoped UC objects (dev + ect own these; dmvm does NOT — ADR-0019) ---
    resources: &shared_uc
      schemas:
        care_protocol:
          catalog_name: ${var.catalog}
          name: care_protocol
          comment: Medallion (raw→bronze→silver→gold) + base tables for the care-protocol HEDIS demo (synthetic).
        care_protocol_semantic:
          catalog_name: ${var.catalog}
          name: care_protocol_semantic
          comment: >-
            Governed UC metric views (the BI/Genie semantic layer) over gold_adherence_*. Kept in a schema
            separate from care_protocol so an ontology/graph scan scoped to the base schema never ingests the
            metric views — they are a consumption layer, not base data (ADR-0013). HEDIS demo, not NCQA-certified.
        care_protocol_terminology:
          catalog_name: ${var.catalog}
          name: care_protocol_terminology
          comment: >-
            Terminology-as-data: curated LOINC/ICD-10-CM/RxNorm subsets + demo value sets + ICD-10 closure
            (HEDIS demo, not NCQA-certified).
        # ---- Clinical Study Context & Evidence Lab (life_sciences_clinical; ADR-0023). ECT/dev only: these, the
        # life-sciences pipeline and jobs all live inside this anchor, so dmvm never deploys them.
        clinical_study:
          catalog_name: ${var.catalog}
          name: clinical_study
          comment: >-
            Clinical Study lab medallion: bronze_edc_* (raw EDC exports) -> silver_* (SDTM-shaped) -> gold_*
            (ADaM-shaped endpoint results, every candidate observation, eligibility, populations, provenance).
            SYNTHETIC. Not submission-ready SDTM/ADaM.
        clinical_study_semantic:
          catalog_name: ${var.catalog}
          name: clinical_study_semantic
          comment: >-
            Governed UC metric views for the Clinical Study lab (consumption layer only, ADR-0013 pattern). Every
            metric keeps study + rule-version context; nothing is pooled across studies. SYNTHETIC.
        clinical_study_graph:
          catalog_name: ${var.catalog}
          name: clinical_study_graph
          comment: >-
            Ontobricks source scope for the Clinical Study lab: one view per graph class (e_*) and per relationship
            (r_*), generated from src/clinical_study/graph_spec.py. Inputs and derived results only; eligibility and
            population answers are deliberately absent so the graph has to derive them (ADR-0025). SYNTHETIC.
        clinical_study_standards:
          catalog_name: ${var.catalog}
          name: clinical_study_standards
          comment: >-
            Vendored open standards for the Clinical Study lab (MONDO, MED-RT, MeSH, RxNorm, CDISC CT, COSMoS,
            NCIt) as kb_concept/kb_edge (direct facts only), closures, and the approved rule registry (ADR-0022).
      volumes:
        synthea:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.care_protocol.name}
          name: synthea
          volume_type: MANAGED
          comment: Staged Synthea JAR + raw generator output (binary; not in git).
        ontology_pages:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.care_protocol.name}
          name: ontology_pages
          volume_type: MANAGED
          comment: Genie Ontology Pages source (docs/ontology/pages/*.md), staged for Genie Code bulk import.
        documents:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.care_protocol.name}
          name: documents
          volume_type: MANAGED
          comment: Unstructured clinical documents (the care-protocol PDF) for RAG / ai_parse_document — the lineage anchor.
        source_documents:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.care_protocol.name}
          name: source_documents
          volume_type: MANAGED
          comment: >-
            Pages-ready SOURCE material (facts-only mined extracts + synthesized corpus Markdown) for Genie Code
            Pages bulk import — a second volume so source docs stay separate from the finished ontology_pages.
            Staged by scripts/stage_source_documents.py. Raw proprietary PDFs are NOT stored here (see RUNBOOK).

        raw_edc:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.clinical_study.name}
          name: raw_edc
          volume_type: MANAGED
          comment: Landing zone for the synthetic EDC CSV exports (scripts/ls_generate.py). SYNTHETIC.
        clinical_documents:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.clinical_study.name}
          name: documents
          volume_type: MANAGED
          comment: Synthetic protocol / SAP / amendment / mapping-spec documents (md, html, pdf) for RAG and Pages.
        clinical_pages:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.clinical_study.name}
          name: ontology_pages
          volume_type: MANAGED
          comment: Clinical Study lab Pages sources (docs/life_sciences/pages/*.md), staged for manual import.
        standards_cache:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.clinical_study_standards.name}
          name: standards_cache
          volume_type: MANAGED
          comment: Pinned raw standards releases (checksummed against standards_manifest.yaml) for reproducible KB rebuilds.

      pipelines:
        clinical_study:
          name: clinical_study_${bundle.target}
          catalog: ${var.catalog}
          schema: ${resources.schemas.clinical_study.name}
          serverless: true
          configuration:
            cs.catalog: ${var.catalog}
            cs.landing: /Volumes/${var.catalog}/${resources.schemas.clinical_study.name}/raw_edc/current
            cs.src_path: ${workspace.file_path}/src
          environment:
            dependencies:
              - pyyaml
          libraries:
            - file:
                path: src/pipelines/clinical_study.py

      jobs:
        ls_bootstrap:
          name: ls_bootstrap_${bundle.target}
          description: >-
            Clinical Study lab end to end: load vendored standards + rule registry -> closures; generate synthetic
            EDC exports -> pipeline (bronze/silver/gold) -> gold oracle check. Reruns are idempotent (same seed =
            same bytes). Never resets other demos.
          parameters:
            - {name: scale, default: demo}
            - {name: seed, default: "2026"}
          tasks:
            - task_key: load_standards
              spark_python_task:
                python_file: scripts/ls_load_standards.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: build_closures
              depends_on: [{task_key: load_standards}]
              spark_python_task:
                python_file: scripts/ls_build_closures.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: generate_edc
              spark_python_task:
                python_file: scripts/ls_generate.py
                parameters: ["--src_dir", "${workspace.file_path}/src",
                             "--out", "/Volumes/${var.catalog}/clinical_study/raw_edc/current",
                             "--scale", "{{job.parameters.scale}}", "--seed", "{{job.parameters.seed}}"]
              environment_key: ls
            - task_key: pipeline
              depends_on: [{task_key: load_standards}, {task_key: generate_edc}]
              pipeline_task:
                pipeline_id: ${resources.pipelines.clinical_study.id}
            - task_key: verify_gold
              depends_on: [{task_key: pipeline}, {task_key: build_closures}]
              spark_python_task:
                python_file: scripts/ls_verify_gold.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: load_documents
              depends_on: [{task_key: load_standards}]
              spark_python_task:
                python_file: scripts/ls_load_documents.py
                parameters: ["--catalog", "${var.catalog}", "--repo_dir", "${workspace.file_path}"]
              environment_key: ls
            - task_key: graph_and_validation
              depends_on: [{task_key: verify_gold}, {task_key: load_documents}]
              spark_python_task:
                python_file: scripts/ls_apply_sql.py
                parameters: ["--catalog", "${var.catalog}",
                             "--file", "${workspace.file_path}/src/ontology/life_sciences/graph_views.sql",
                             "--file", "${workspace.file_path}/src/clinical_study/sql/semantic_validation.sql"]
              environment_key: ls
          environments:
            - environment_key: ls
              spec:
                client: "3"
                dependencies:
                  - dbldatagen==0.4.0post1
                  - pyyaml
                  - xhtml2pdf

        ls_context:
          name: ls_context_${bundle.target}
          description: >-
            Clinical Study lab context refresh without regenerating data: standards + rule registry -> closures ->
            pipeline -> gold oracle check -> documents/RAG corpus/Pages staging -> graph views + semantic validation.
          tasks:
            - task_key: load_standards
              spark_python_task:
                python_file: scripts/ls_load_standards.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: build_closures
              depends_on: [{task_key: load_standards}]
              spark_python_task:
                python_file: scripts/ls_build_closures.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: pipeline
              depends_on: [{task_key: load_standards}]
              pipeline_task:
                pipeline_id: ${resources.pipelines.clinical_study.id}
            - task_key: verify_gold
              depends_on: [{task_key: pipeline}, {task_key: build_closures}]
              spark_python_task:
                python_file: scripts/ls_verify_gold.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
            - task_key: load_documents
              depends_on: [{task_key: load_standards}]
              spark_python_task:
                python_file: scripts/ls_load_documents.py
                parameters: ["--catalog", "${var.catalog}", "--repo_dir", "${workspace.file_path}"]
              environment_key: ls
            - task_key: graph_and_validation
              depends_on: [{task_key: verify_gold}, {task_key: load_documents}]
              spark_python_task:
                python_file: scripts/ls_apply_sql.py
                parameters: ["--catalog", "${var.catalog}",
                             "--file", "${workspace.file_path}/src/ontology/life_sciences/graph_views.sql",
                             "--file", "${workspace.file_path}/src/clinical_study/sql/semantic_validation.sql"]
              environment_key: ls
          environments:
            - environment_key: ls
              spec:
                client: "3"
                dependencies:
                  - pyyaml
                  - xhtml2pdf

        ls_refresh:
          name: ls_refresh_${bundle.target}
          description: Clinical Study lab refresh without regenerating data (pipeline -> gold oracle check).
          tasks:
            - task_key: pipeline
              pipeline_task:
                pipeline_id: ${resources.pipelines.clinical_study.id}
            - task_key: verify_gold
              depends_on: [{task_key: pipeline}]
              spark_python_task:
                python_file: scripts/ls_verify_gold.py
                parameters: ["--catalog", "${var.catalog}", "--src_dir", "${workspace.file_path}/src"]
              environment_key: ls
          environments:
            - environment_key: ls
              spec:
                client: "3"
                dependencies:
                  - pyyaml

  # BASELINE arm (ADR-0018): Genie Ontology OFF — Genie One answers from raw governed metric-views/comments
  # only. ECT also OWNS the shared catalog's schemas/volumes (via *shared_uc). Shares the catalog with dmvm.
  ect:
    mode: production
    workspace:
      host: https://fevm-eli-test-classic.cloud.databricks.com   # profile: ECT
      root_path: /Workspace/Users/eli.swanson@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: eli.swanson@databricks.com
    resources: *shared_uc

  # ONTOLOGY arm (ADR-0018): high inferred-snippet density via Pages + dashboards + Genie agents + query-history
  # + analytics notebooks. Genie Ontology has NO on/off toggle (always on); inferred snippets are only fetched
  # once a workspace exceeds ~1,000 snippets (ECT ≈ 200 = baseline; DMVM ≈ 1,100 = treatment) — so the lever is
  # snippet COUNT, which this arm maximizes. SAME shared catalog as ect (eli_test_classic_catalog) — only the
  # native-ontology density differs; data + modeled metadata are held constant.
  # Deploys ONLY workspace-local assets (Genie spaces, dashboards, jobs, pipeline defs) — it does NOT own the
  # shared schemas/volumes (no *shared_uc; ADR-0019), and the catalog-scoped DATA is already live, so the data
  # jobs/pipeline are deployed-but-not-run here.
  dmvm:
    mode: production
    workspace:
      host: https://fe-vm-vdm-classic-q6xfh3.cloud.databricks.com   # profile: DMVM
      root_path: /Workspace/Users/eli.swanson@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: eli.swanson@databricks.com
    # dmvm is the ONTOLOGY-ON arm: UNPAUSE the hourly analytics notebooks here (PAUSED by default elsewhere) so
    # they continuously mint inferred-ontology fuel (ADR-0018). dmvm owns no shared_uc resources, so this
    # target-level resources override is purely additive.
    resources:
      jobs:
        care_analytics:
          schedule:
            pause_status: UNPAUSED
